<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Error — VATSIM Flight Scheduler</title>
		<style>
			body {
				margin: 0;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				background: #0f172a;
				color: #e2e8f0;
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
			}
			.error {
				text-align: center;
				padding: 2rem;
				max-width: 480px;
			}
			.status {
				font-size: 4rem;
				font-weight: 800;
				color: #ef4444;
				margin: 0;
			}
			.message {
				font-size: 1.125rem;
				color: #94a3b8;
				margin: 1rem 0 2rem;
			}
			a {
				color: #60a5fa;
				text-decoration: none;
				font-weight: 600;
			}
			a:hover {
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<div class="error">
			<p class="status">%sveltekit.status%</p>
			<p class="message">%sveltekit.error.message%</p>
			<a href="/">← Back to home</a>
		</div>
	</body>
</html>
